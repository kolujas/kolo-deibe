<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kolo Deibe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: una sola columna de lectura bajo una luna en la niebla; cada escrito es una entrada de índice, se abre a pantalla completa. */
:root {
  --abismo: #07090c;      /* fondo: agua de noche */
  --niebla: #141a21;      /* superficies */
  --bruma: #6f7d8a;       /* texto secundario, líneas */
  --luna: #d7dee5;        /* texto principal */
  --plata: #9fb4c6;       /* acento frío */
  --brasa: #c8592c;       /* acento cálido, uso mínimo */
  --linea: #1f2730;
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-cuerpo: "Spectral", Georgia, "Times New Roman", serif;
  --f-dato: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--abismo); }
body {
  background: var(--abismo); color: var(--luna);
  font-family: var(--f-cuerpo); font-weight: 300; font-size: 1.0625rem; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--brasa); color: var(--abismo); }
a { color: var(--plata); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--plata); outline-offset: 3px; }

.envoltura { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.columna { max-width: 44rem; margin: 0 auto; }

/* ——— cabecera con luna ——— */
.cabecera { position: relative; overflow: hidden; border-bottom: 1px solid var(--linea); }
#cielo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cabecera .envoltura { position: relative; padding-block: 7rem 3.5rem; }
.firma {
  font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 9vw, 4.6rem);
  line-height: 1; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
}
.firma em { font-style: italic; color: var(--plata); }
.bio { font-style: italic; color: var(--bruma); max-width: 32rem; margin: 1.2rem 0 0; white-space: pre-line; }
.meta-cabecera {
  display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: center; margin-top: 2rem;
  font-family: var(--f-dato); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bruma);
}
.meta-cabecera a { color: var(--bruma); text-decoration: none; border-bottom: 1px solid var(--linea); }
.meta-cabecera a:hover { color: var(--luna); }

/* ——— barra del autor ——— */
.barra-autor { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.boton {
  background: transparent; border: 1px solid var(--bruma); color: var(--luna);
  padding: .55rem 1.1rem; cursor: pointer; font-family: var(--f-dato); font-size: .72rem;
  letter-spacing: .14em; text-transform: uppercase; transition: border-color .2s, color .2s, background .2s;
}
.boton:hover { border-color: var(--luna); }
.boton.principal { border-color: var(--brasa); color: var(--abismo); background: var(--brasa); }
.boton.principal:hover { background: transparent; color: var(--brasa); }
.boton.peligro { border-color: transparent; color: var(--brasa); padding-inline: .2rem; }
.boton.peligro:hover { text-decoration: underline; }
.boton[disabled] { opacity: .45; cursor: wait; }

/* ——— índice ——— */
.indice .envoltura { padding-block: 3rem 6rem; }
.filtros { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2.5rem; }
.filtro {
  background: none; border: none; cursor: pointer; padding: .15rem 0; margin-right: .9rem;
  font-family: var(--f-dato); font-size: .72rem; letter-spacing: .12em; text-transform: lowercase; color: var(--bruma);
  border-bottom: 1px solid transparent;
}
.filtro[aria-pressed="true"] { color: var(--luna); border-bottom-color: var(--brasa); }
.lista { list-style: none; margin: 0; padding: 0; display: grid; }
.entrada {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.5rem; align-items: start;
  padding-block: 2.2rem; border-top: 1px solid var(--linea); cursor: pointer;
}
.entrada:last-child { border-bottom: 1px solid var(--linea); }
.entrada:hover .titulo-entrada { color: var(--plata); }
.entrada:focus-visible { outline-offset: 6px; }
.dato { font-family: var(--f-dato); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bruma); font-variant-numeric: tabular-nums; }
.titulo-entrada { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; margin: .4rem 0 .8rem; transition: color .25s; text-wrap: balance; }
.extracto { color: var(--bruma); margin: 0; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.miniatura { width: 7.5rem; aspect-ratio: 4 / 5; max-width: 100%; object-fit: cover; filter: grayscale(.55) brightness(.8) contrast(1.05); display: block; }
@media (max-width: 520px) { .miniatura { width: 5rem; } }

.vacio { padding-block: 3rem; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.vacio p { margin: 0; }
.vacio .grande { font-family: var(--f-display); font-style: italic; font-size: 1.7rem; line-height: 1.3; }
.vacio .chico { color: var(--bruma); margin-top: .8rem; }

/* ——— lectura y editor (pantalla completa) ——— */
.velo {
  position: fixed; inset: 0; z-index: 20; background: var(--abismo); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.velo-barra {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding-block: 1rem; background: var(--abismo); border-bottom: 1px solid var(--linea);
}
.lectura .envoltura.cuerpo-lectura { padding-block: 3.5rem 7rem; }
.portada { width: 100%; max-height: 62vh; object-fit: cover; display: block; filter: grayscale(.35) brightness(.85); }
.titulo-lectura { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.08; margin: .8rem 0 2.6rem; text-wrap: balance; }
.texto { max-width: 34rem; font-size: 1.15rem; line-height: 1.85; }
.texto p { margin: 0; }
.texto.prosa p + p { text-indent: 1.6em; }
.texto.prosa p:first-child::first-letter { font-family: var(--f-display); float: left; font-size: 3.4em; line-height: .85; padding: .08em .1em 0 0; color: var(--plata); }
.texto.verso { white-space: pre-wrap; }
.texto.verso p + p { margin-top: 1.4em; }
.cierre { margin-top: 4rem; color: var(--brasa); font-family: var(--f-display); font-size: 1.4rem; letter-spacing: .6em; }
.etiquetas { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: 1.5rem; }

/* editor */
.formulario { display: grid; gap: 1.6rem; padding-block: 2.5rem 6rem; }
.campo { display: grid; gap: .45rem; min-width: 0; }
.campo label, .campo .rotulo { font-family: var(--f-dato); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--bruma); }
.entrada-texto {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--linea); padding: .5rem 0; border-radius: 0;
}
.entrada-texto:focus { outline: none; border-bottom-color: var(--plata); }
#ed-titulo { font-family: var(--f-display); font-style: italic; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.2; }
#ed-cuerpo {
  min-height: 55vh; resize: vertical; border: 1px solid var(--linea); padding: 1.2rem; background: var(--niebla);
  font-size: 1.1rem; line-height: 1.85;
}
#ed-cuerpo:focus { outline: none; border-color: var(--bruma); }
.fila { display: flex; flex-wrap: wrap; gap: 1.6rem; }
.fila > .campo { flex: 1 1 14rem; }
.forma { display: flex; gap: 0; border: 1px solid var(--linea); width: max-content; }
.forma button { background: none; border: none; padding: .45rem 1rem; cursor: pointer; font-family: var(--f-dato); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bruma); }
.forma button[aria-pressed="true"] { background: var(--niebla); color: var(--luna); }
.vista-imagen { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.vista-imagen img { width: 5rem; aspect-ratio: 4/5; object-fit: cover; }
.acciones { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; border-top: 1px solid var(--linea); padding-top: 1.6rem; }
.acciones .grupo { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
.contador { color: var(--bruma); }
.confirmar { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; color: var(--brasa); font-style: italic; }

.aviso {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--niebla); border: 1px solid var(--linea); padding: .7rem 1.2rem; font-family: var(--f-dato); font-size: .75rem; letter-spacing: .08em; max-width: calc(100% - 32px);
}
.aviso.error { border-color: var(--brasa); color: var(--brasa); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="cabecera">
  <canvas id="cielo" aria-hidden="true"></canvas>
  <div class="envoltura"><div class="columna">
    <h1 class="firma" id="firma">Kolo <em>Deibe</em></h1>
    <p class="bio" id="bio">Escritos oscuros, viscerales. Lo que queda cuando se apaga la luz y uno se queda a solas con lo que siente.</p>
    <div class="meta-cabecera">
      <span id="cuenta">— escritos</span>
      <a id="link-ig" href="#" target="_blank" rel="noopener" hidden></a>
    </div>
    <div class="barra-autor" id="barra-autor" hidden>
      <button class="boton principal" id="btn-escribir" type="button">Escribir</button>
      <button class="boton" id="btn-perfil" type="button">Editar portada</button>
    </div>
  </div></div>
</header>

<main class="indice">
  <div class="envoltura"><div class="columna">
    <nav class="filtros" id="filtros" aria-label="Filtrar por etiqueta" hidden></nav>
    <ol class="lista" id="lista"></ol>
    <div class="vacio" id="vacio">
      <p class="grande" id="vacio-titulo">Cargando los escritos…</p>
      <p class="chico" id="vacio-texto">Cada texto aparece acá, del más reciente al más antiguo.</p>
    </div>
  </div></div>
</main>

<!-- lectura -->
<section class="velo lectura" id="lectura" hidden aria-modal="true" role="dialog" aria-labelledby="lec-titulo">
  <div class="velo-barra envoltura">
    <button class="boton" id="lec-cerrar" type="button">← Volver</button>
    <div class="grupo" style="display:flex;gap:.8rem">
      <button class="boton" id="lec-copiar" type="button">Copiar link</button>
      <button class="boton" id="lec-editar" type="button" hidden>Editar</button>
    </div>
  </div>
  <img class="portada" id="lec-portada" alt="" hidden>
  <div class="envoltura cuerpo-lectura"><div class="columna">
    <div class="dato" id="lec-dato"></div>
    <h2 class="titulo-lectura" id="lec-titulo"></h2>
    <div class="texto" id="lec-texto"></div>
    <div class="cierre" aria-hidden="true">· · ·</div>
    <div class="etiquetas dato" id="lec-etiquetas"></div>
  </div></div>
</section>

<!-- editor -->
<section class="velo" id="editor" hidden aria-modal="true" role="dialog" aria-label="Editor">
  <div class="velo-barra envoltura">
    <button class="boton" id="ed-cerrar" type="button">← Salir sin publicar</button>
    <span class="dato contador" id="ed-contador">0 palabras</span>
  </div>
  <div class="envoltura"><div class="columna">
    <form class="formulario" id="ed-form" autocomplete="off">
      <div class="campo">
        <label for="ed-titulo">Título</label>
        <input class="entrada-texto" id="ed-titulo" maxlength="140" placeholder="Lo que no dije" required>
      </div>
      <div class="campo">
        <label for="ed-cuerpo">Texto</label>
        <textarea class="entrada-texto" id="ed-cuerpo" placeholder="Escribí. Dejá una línea en blanco entre párrafos o estrofas." required></textarea>
      </div>
      <div class="fila">
        <div class="campo">
          <span class="rotulo" id="rot-forma">Forma</span>
          <div class="forma" role="group" aria-labelledby="rot-forma">
            <button type="button" data-forma="prosa" aria-pressed="true">Prosa</button>
            <button type="button" data-forma="verso" aria-pressed="false">Verso</button>
          </div>
        </div>
        <div class="campo">
          <label for="ed-etiquetas">Etiquetas, separadas por coma</label>
          <input class="entrada-texto" id="ed-etiquetas" placeholder="duelo, insomnio, agua">
        </div>
      </div>
      <div class="campo">
        <label for="ed-imagen">Imagen de portada (opcional)</label>
        <div class="vista-imagen">
          <img id="ed-vista" alt="" hidden>
          <input type="file" id="ed-imagen" accept="image/*">
          <button class="boton peligro" id="ed-quitar-img" type="button" hidden>Quitar imagen</button>
        </div>
      </div>
      <div class="acciones">
        <div class="grupo">
          <button class="boton principal" id="ed-publicar" type="submit">Publicar</button>
          <span class="dato" id="ed-estado"></span>
        </div>
        <div class="grupo" id="ed-zona-borrar" hidden>
          <button class="boton peligro" id="ed-borrar" type="button">Borrar escrito</button>
          <span class="confirmar" id="ed-confirmar" hidden>¿Borrarlo para siempre?
            <button class="boton" id="ed-borrar-si" type="button">Sí, borrar</button>
            <button class="boton" id="ed-borrar-no" type="button">No</button>
          </span>
        </div>
      </div>
    </form>
  </div></div>
</section>

<!-- portada / perfil -->
<section class="velo" id="perfil" hidden aria-modal="true" role="dialog" aria-label="Editar portada">
  <div class="velo-barra envoltura">
    <button class="boton" id="pf-cerrar" type="button">← Volver</button>
  </div>
  <div class="envoltura"><div class="columna">
    <form class="formulario" id="pf-form" autocomplete="off">
      <div class="campo">
        <label for="pf-nombre">Nombre del sitio o firma</label>
        <input class="entrada-texto" id="pf-nombre" maxlength="60" style="font-family:var(--f-display);font-size:2rem">
      </div>
      <div class="campo">
        <label for="pf-bio">Presentación</label>
        <textarea class="entrada-texto" id="pf-bio" rows="4" maxlength="400" style="font-style:italic"></textarea>
      </div>
      <div class="campo">
        <label for="pf-ig">Usuario de Instagram (sin @)</label>
        <input class="entrada-texto" id="pf-ig" maxlength="40" placeholder="tu.usuario">
      </div>
      <div class="acciones"><div class="grupo">
        <button class="boton principal" id="pf-guardar" type="submit">Guardar portada</button>
      </div></div>
    </form>
  </div></div>
</section>

<div class="aviso" id="aviso" role="status" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PERFIL_DEF = { nombre: "Kolo Deibe", bio: $("bio").textContent, instagram: "" };
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  let db = null, assets = null, puedeEscribir = false;
  let escritos = [];             // [{id, ...data}]
  let perfil = { ...PERFIL_DEF };
  let filtro = null;
  let abierto = null;            // id en lectura
  let edicion = null;            // {id|null, forma, imagen}
  let cargado = false;

  /* ——— utilidades ——— */
  const palabras = (t) => (t.trim().match(/\S+/g) || []).length;
  const minutos = (t) => Math.max(1, Math.round(palabras(t) / 200));
  const fecha = (ms) => { const d = new Date(ms); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
  const idNuevo = () => "e-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
  const imgUrl = (img) => img ? (img.url || ("/_blob/" + img.id)) : null;
  let avisoT;
  function avisar(msg, error) {
    const a = $("aviso"); a.textContent = msg; a.classList.toggle("error", !!error); a.hidden = false;
    clearTimeout(avisoT); avisoT = setTimeout(() => (a.hidden = true), 3200);
  }
  const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const leerLocal = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
  const borrarLocal = (k) => { try { localStorage.removeItem(k); } catch {} };

  /* ——— render ——— */
  function renderPerfil() {
    const n = perfil.nombre || PERFIL_DEF.nombre;
    const partes = n.split(" ");
    const firma = $("firma"); firma.textContent = "";
    if (partes.length > 1) {
      firma.append(partes.slice(0, -1).join(" ") + " ");
      const em = document.createElement("em"); em.textContent = partes.at(-1); firma.append(em);
    } else firma.textContent = n;
    $("bio").textContent = perfil.bio || "";
    const ig = $("link-ig");
    if (perfil.instagram) { ig.href = "https://www.instagram.com/" + encodeURIComponent(perfil.instagram) + "/"; ig.textContent = "@" + perfil.instagram; ig.hidden = false; }
    else ig.hidden = true;
  }

  function renderLista() {
    const lista = $("lista"); lista.textContent = "";
    const total = escritos.length;
    $("cuenta").textContent = total === 1 ? "1 escrito" : `${total} escritos`;

    const tags = [...new Set(escritos.flatMap((e) => e.etiquetas || []))].sort();
    const nav = $("filtros"); nav.textContent = "";
    nav.hidden = tags.length === 0;
    if (filtro && !tags.includes(filtro)) filtro = null;
    for (const t of [null, ...tags]) {
      const b = document.createElement("button");
      b.className = "filtro"; b.type = "button"; b.textContent = t ? "#" + t : "todos";
      b.setAttribute("aria-pressed", String(filtro === t));
      b.onclick = () => { filtro = t; renderLista(); };
      nav.append(b);
    }

    const visibles = escritos.filter((e) => !filtro || (e.etiquetas || []).includes(filtro));
    for (const e of visibles) {
      const li = document.createElement("li");
      li.className = "entrada"; li.tabIndex = 0; li.setAttribute("role", "link");
      const txt = document.createElement("div"); txt.style.minWidth = "0";
      const d = document.createElement("div"); d.className = "dato";
      d.textContent = `${fecha(e.fecha)} · ${minutos(e.cuerpo)} min · ${e.forma === "verso" ? "verso" : "prosa"}`;
      const h = document.createElement("h2"); h.className = "titulo-entrada"; h.textContent = e.titulo;
      const p = document.createElement("p"); p.className = "extracto"; p.textContent = e.cuerpo.trim().split(/\n\s*\n/)[0];
      txt.append(d, h, p); li.append(txt);
      const u = imgUrl(e.imagen);
      if (u) { const im = document.createElement("img"); im.className = "miniatura"; im.src = u; im.alt = ""; im.loading = "lazy"; li.append(im); }
      li.onclick = () => abrir(e.id);
      li.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(e.id); } };
      lista.append(li);
    }

    const vacio = $("vacio");
    vacio.hidden = visibles.length > 0;
    if (!cargado) { $("vacio-titulo").textContent = "Cargando los escritos…"; $("vacio-texto").textContent = "Cada texto aparece acá, del más reciente al más antiguo."; }
    else if (puedeEscribir) { $("vacio-titulo").textContent = "La página está en blanco, esperando."; $("vacio-texto").textContent = "Tocá «Escribir» para publicar tu primer texto. Solo vos podés publicar; el resto lo lee."; }
    else { $("vacio-titulo").textContent = "Todavía no hay nada escrito acá."; $("vacio-texto").textContent = "Volvé pronto. Los textos aparecen apenas se publican."; }
  }

  /* ——— lectura ——— */
  function abrir(id) {
    const e = escritos.find((x) => x.id === id); if (!e) return;
    abierto = id;
    $("lec-dato").textContent = `${fecha(e.fecha)} · ${palabras(e.cuerpo)} palabras · ${minutos(e.cuerpo)} min de lectura`;
    $("lec-titulo").textContent = e.titulo;
    const t = $("lec-texto"); t.textContent = ""; t.className = "texto " + (e.forma === "verso" ? "verso" : "prosa");
    for (const bloque of e.cuerpo.trim().split(/\n\s*\n/)) {
      const p = document.createElement("p");
      p.textContent = e.forma === "verso" ? bloque : bloque.replace(/\s*\n\s*/g, " ");
      t.append(p);
    }
    const u = imgUrl(e.imagen), por = $("lec-portada");
    if (u) { por.src = u; por.hidden = false; } else { por.removeAttribute("src"); por.hidden = true; }
    const et = $("lec-etiquetas"); et.textContent = "";
    for (const tag of e.etiquetas || []) { const s = document.createElement("span"); s.textContent = "#" + tag; et.append(s); }
    $("lec-editar").hidden = !puedeEscribir;
    const v = $("lectura"); v.hidden = false; v.scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    $("lec-cerrar").focus({ preventScroll: true });
  }
  function cerrarLectura() {
    $("lectura").hidden = true; abierto = null; document.body.style.overflow = "";
    history.replaceState(null, "", location.pathname + location.search);
  }
  $("lec-cerrar").onclick = cerrarLectura;
  $("lec-editar").onclick = () => { const id = abierto; cerrarLectura(); abrirEditor(id); };
  $("lec-copiar").onclick = async () => {
    const url = location.href.split("#")[0] + "#" + abierto;
    try { await navigator.clipboard.writeText(url); avisar("Link copiado"); }
    catch { avisar("No se pudo copiar. Link: " + url); }
  };

  /* ——— editor ——— */
  function setForma(f) {
    edicion.forma = f;
    document.querySelectorAll(".forma button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.forma === f)));
  }
  document.querySelectorAll(".forma button").forEach((b) => (b.onclick = () => { setForma(b.dataset.forma); guardarBorrador(); }));

  function setImagen(img) {
    edicion.imagen = img;
    const v = $("ed-vista"), u = imgUrl(img);
    if (u) { v.src = u; v.hidden = false; } else { v.removeAttribute("src"); v.hidden = true; }
    $("ed-quitar-img").hidden = !img;
    $("ed-imagen").value = "";
  }

  function contar() { const n = palabras($("ed-cuerpo").value); $("ed-contador").textContent = `${n} ${n === 1 ? "palabra" : "palabras"}`; }

  function abrirEditor(id) {
    const e = id ? escritos.find((x) => x.id === id) : null;
    edicion = { id: e ? e.id : null, forma: "prosa", imagen: null };
    const borrador = !e ? leerLocal("kolo-borrador") : null;
    const src = e || borrador || {};
    $("ed-titulo").value = src.titulo || "";
    $("ed-cuerpo").value = src.cuerpo || "";
    $("ed-etiquetas").value = (src.etiquetas || []).join(", ");
    setForma(src.forma === "verso" ? "verso" : "prosa");
    setImagen(src.imagen || null);
    $("ed-publicar").textContent = e ? "Guardar cambios" : "Publicar";
    $("ed-cerrar").textContent = e ? "← Salir sin guardar" : "← Salir (queda el borrador)";
    $("ed-zona-borrar").hidden = !e; $("ed-confirmar").hidden = true; $("ed-borrar").hidden = false;
    $("ed-estado").textContent = borrador && !e ? "borrador recuperado" : "";
    $("ed-imagen").closest(".campo").hidden = !assets;
    contar();
    $("editor").hidden = false; $("editor").scrollTop = 0; document.body.style.overflow = "hidden";
    $("ed-titulo").focus();
  }
  function cerrarEditor() { $("editor").hidden = true; edicion = null; document.body.style.overflow = ""; }
  $("ed-cerrar").onclick = cerrarEditor;
  $("btn-escribir").onclick = () => abrirEditor(null);

  let borradorT;
  function guardarBorrador() {
    if (!edicion || edicion.id) return;
    clearTimeout(borradorT);
    borradorT = setTimeout(() => {
      guardarLocal("kolo-borrador", { titulo: $("ed-titulo").value, cuerpo: $("ed-cuerpo").value, etiquetas: leerEtiquetas(), forma: edicion?.forma, imagen: edicion?.imagen });
      $("ed-estado").textContent = "borrador guardado en este navegador";
    }, 600);
  }
  ["ed-titulo", "ed-cuerpo", "ed-etiquetas"].forEach((id) => $(id).addEventListener("input", () => { contar(); guardarBorrador(); }));
  const leerEtiquetas = () => [...new Set($("ed-etiquetas").value.split(",").map((s) => s.trim().toLowerCase().replace(/^#/, "")).filter(Boolean))].slice(0, 8);

  $("ed-imagen").onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f || !assets) return;
    if (f.size > 20 * 1024 * 1024) { avisar("La imagen pesa más de 20 MB. Probá con una más liviana.", true); return; }
    $("ed-estado").textContent = "subiendo imagen…"; $("ed-publicar").disabled = true;
    try { const r = await assets.upload(f); setImagen({ id: r.id, url: r.url }); $("ed-estado").textContent = "imagen lista"; guardarBorrador(); }
    catch (e) { avisar("No se pudo subir la imagen: " + (e?.message || "error desconocido"), true); $("ed-estado").textContent = ""; }
    finally { $("ed-publicar").disabled = false; }
  };
  $("ed-quitar-img").onclick = () => { setImagen(null); guardarBorrador(); };

  $("ed-form").onsubmit = async (ev) => {
    ev.preventDefault(); if (!db || !edicion) return;
    const titulo = $("ed-titulo").value.trim(), cuerpo = $("ed-cuerpo").value.replace(/\s+$/, "");
    if (!titulo || !cuerpo.trim()) { avisar("Falta el título o el texto.", true); return; }
    const previo = edicion.id ? escritos.find((x) => x.id === edicion.id) : null;
    const datos = {
      titulo, cuerpo, forma: edicion.forma, etiquetas: leerEtiquetas(), imagen: edicion.imagen || null,
      fecha: previo ? previo.fecha : Date.now(), editado: previo ? Date.now() : null,
    };
    const id = edicion.id || idNuevo();
    const btn = $("ed-publicar"); btn.disabled = true; $("ed-estado").textContent = "publicando…";
    try {
      await db.collection("escritos").doc(id).set(datos);
      if (!previo) borrarLocal("kolo-borrador");
      cerrarEditor(); avisar(previo ? "Cambios guardados" : "Publicado");
    } catch (e) {
      $("ed-estado").textContent = "";
      avisar(e?.code === "invalid_argument" ? "No tenés permiso para publicar acá." : "No se pudo publicar. Probá de nuevo en un momento.", true);
    } finally { btn.disabled = false; }
  };

  $("ed-borrar").onclick = () => { $("ed-confirmar").hidden = false; $("ed-borrar").hidden = true; };
  $("ed-borrar-no").onclick = () => { $("ed-confirmar").hidden = true; $("ed-borrar").hidden = false; };
  $("ed-borrar-si").onclick = async () => {
    if (!edicion?.id) return;
    try { await db.collection("escritos").doc(edicion.id).delete(); cerrarEditor(); avisar("Escrito borrado"); }
    catch { avisar("No se pudo borrar. Probá de nuevo.", true); }
  };

  /* ——— perfil ——— */
  $("btn-perfil").onclick = () => {
    $("pf-nombre").value = perfil.nombre || ""; $("pf-bio").value = perfil.bio || ""; $("pf-ig").value = perfil.instagram || "";
    $("perfil").hidden = false; document.body.style.overflow = "hidden"; $("pf-nombre").focus();
  };
  const cerrarPerfil = () => { $("perfil").hidden = true; document.body.style.overflow = ""; };
  $("pf-cerrar").onclick = cerrarPerfil;
  $("pf-form").onsubmit = async (ev) => {
    ev.preventDefault(); if (!db) return;
    const datos = { nombre: $("pf-nombre").value.trim() || PERFIL_DEF.nombre, bio: $("pf-bio").value.trim(), instagram: $("pf-ig").value.trim().replace(/^@/, "") };
    try { await db.doc("sitio/perfil").set(datos); cerrarPerfil(); avisar("Portada guardada"); }
    catch { avisar("No se pudo guardar la portada.", true); }
  };

  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (!$("lectura").hidden) cerrarLectura(); else if (!$("perfil").hidden) cerrarPerfil();
  });

  /* ——— datos ——— */
  renderPerfil(); renderLista();
  (async () => {
    const c = window.claude;
    if (!c?.use) { cargado = true; renderLista(); return; }
    const [d, u, a] = await Promise.all([c.use("db"), c.use("user"), c.use("assets")]);
    db = d; assets = a;
    puedeEscribir = !!(u && (u.canEdit?.() || u.isOwner?.())) && !!db;
    $("barra-autor").hidden = !puedeEscribir;
    if (!db) { cargado = true; renderLista(); return; }
    db.doc("sitio/perfil").onSnapshot((s) => { perfil = s.exists ? { ...PERFIL_DEF, ...s.data() } : { ...PERFIL_DEF }; renderPerfil(); }, () => {});
    db.collection("escritos").orderBy("fecha", "desc").onSnapshot((snap) => {
      escritos = snap.docs.map((x) => ({ id: x.id, ...x.data() }));
      const primera = !cargado; cargado = true; renderLista();
      if (primera) { const h = location.hash.slice(1); if (h && escritos.some((e) => e.id === h)) abrir(h); }
      else if (abierto && !escritos.some((e) => e.id === abierto)) cerrarLectura();
    }, () => { cargado = true; renderLista(); });
  })();

  /* ——— cielo: luna, niebla y reflejo ——— */
  const cv = $("cielo"), cx = cv.getContext("2d");
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, bancos = [];
  function medir() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bancos = Array.from({ length: 9 }, (_, i) => ({ x: Math.random() * W, y: H * (0.35 + Math.random() * 0.6), r: 120 + Math.random() * 220, v: 0.05 + Math.random() * 0.12, a: 0.035 + Math.random() * 0.05 }));
  }
  function dibujar(t) {
    cx.fillStyle = "#07090c"; cx.fillRect(0, 0, W, H);
    const mx = W * (W < 600 ? 0.78 : 0.8), my = H * 0.28, mr = Math.max(22, Math.min(W, H) * 0.07);
    const halo = cx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 7);
    halo.addColorStop(0, "rgba(159,180,198,0.22)"); halo.addColorStop(1, "rgba(159,180,198,0)");
    cx.fillStyle = halo; cx.fillRect(0, 0, W, H);
    cx.beginPath(); cx.arc(mx, my, mr, 0, Math.PI * 2); cx.fillStyle = "#cdd7df"; cx.fill();
    cx.fillStyle = "rgba(120,135,150,0.18)";
    [[-.3,-.2,.22],[.25,.15,.16],[-.05,.38,.12]].forEach(([dx,dy,s]) => { cx.beginPath(); cx.arc(mx + dx*mr, my + dy*mr, s*mr, 0, Math.PI*2); cx.fill(); });
    // reflejo en el agua
    const hz = H * 0.78;
    for (let i = 0; i < 14; i++) {
      const yy = hz + i * ((H - hz) / 14), w = mr * (1.4 - i * 0.05) * (0.7 + 0.3 * Math.sin(t / 900 + i * 1.7));
      cx.fillStyle = `rgba(205,215,223,${0.16 - i * 0.009})`; cx.fillRect(mx - w / 2, yy, w, 1.4);
    }
    // niebla
    for (const b of bancos) {
      if (!quieto) { b.x += b.v; if (b.x - b.r > W) b.x = -b.r; }
      const g = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `rgba(130,145,160,${b.a})`); g.addColorStop(1, "rgba(130,145,160,0)");
      cx.fillStyle = g; cx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    // fundido al abismo
    const f = cx.createLinearGradient(0, H * 0.55, 0, H);
    f.addColorStop(0, "rgba(7,9,12,0)"); f.addColorStop(1, "rgba(7,9,12,0.9)");
    cx.fillStyle = f; cx.fillRect(0, 0, W, H);
    if (!quieto) requestAnimationFrame(dibujar);
  }
  medir(); addEventListener("resize", () => { medir(); if (quieto) dibujar(0); });
  requestAnimationFrame(dibujar);
})();
</script>
</body>
</html>
